version: 1
frontend:
  phases:
    build:
      commands:
        - npm install -g @angular/cli@17.0.0
        - ng version
        - ng build --configuration=production
  artifacts:
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*